<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Dial &amp; Ledger</title>
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: slim left rail + glass workspace over a soft metallic glow. The one bold move is the live sweep-second dial in the brand mark. */
:root{
  --bg:#E4E9EF; --glow-a:rgba(176,132,60,.26); --glow-b:rgba(70,112,165,.22);
  --panel:rgba(255,255,255,.60); --panel-strong:rgba(255,255,255,.92); --edge:rgba(255,255,255,.8);
  --ink:#121923; --muted:#556173; --line:rgba(18,25,35,.12); --field:rgba(255,255,255,.78);
  --accent:#8F6118; --accent-soft:rgba(143,97,24,.12); --on-accent:#FFFFFF;
  --good:#17754E; --good-bg:rgba(23,117,78,.13);
  --warn:#8F6310; --warn-bg:rgba(176,122,20,.16);
  --bad:#B1352A; --bad-bg:rgba(177,53,42,.12);
  --info:#255F97; --info-bg:rgba(37,95,151,.12);
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 14px 34px -16px rgba(20,32,54,.35);
  --shadow-lift:0 1px 0 rgba(255,255,255,.7) inset,0 20px 40px -16px rgba(20,32,54,.42);
  --scrim:rgba(14,20,30,.45);
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090D13; --glow-a:rgba(214,164,78,.15); --glow-b:rgba(76,128,190,.18);
  --panel:rgba(27,35,48,.58); --panel-strong:rgba(21,28,39,.94); --edge:rgba(255,255,255,.09);
  --ink:#E9EDF3; --muted:#9CA8B9; --line:rgba(233,237,243,.13); --field:rgba(8,12,18,.55);
  --accent:#DBAA52; --accent-soft:rgba(219,170,82,.15); --on-accent:#1B1305;
  --good:#4CC38A; --good-bg:rgba(76,195,138,.15);
  --warn:#E6B44F; --warn-bg:rgba(230,180,79,.16);
  --bad:#F2796C; --bad-bg:rgba(242,121,108,.15);
  --info:#74B2EA; --info-bg:rgba(116,178,234,.15);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 36px -16px rgba(0,0,0,.7);
  --shadow-lift:0 1px 0 rgba(255,255,255,.06) inset,0 22px 44px -16px rgba(0,0,0,.8);
  --scrim:rgba(2,5,9,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090D13; --glow-a:rgba(214,164,78,.15); --glow-b:rgba(76,128,190,.18);
  --panel:rgba(27,35,48,.58); --panel-strong:rgba(21,28,39,.94); --edge:rgba(255,255,255,.09);
  --ink:#E9EDF3; --muted:#9CA8B9; --line:rgba(233,237,243,.13); --field:rgba(8,12,18,.55);
  --accent:#DBAA52; --accent-soft:rgba(219,170,82,.15); --on-accent:#1B1305;
  --good:#4CC38A; --good-bg:rgba(76,195,138,.15);
  --warn:#E6B44F; --warn-bg:rgba(230,180,79,.16);
  --bad:#F2796C; --bad-bg:rgba(242,121,108,.15);
  --info:#74B2EA; --info-bg:rgba(116,178,234,.15);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 36px -16px rgba(0,0,0,.7);
  --shadow-lift:0 1px 0 rgba(255,255,255,.06) inset,0 22px 44px -16px rgba(0,0,0,.8);
  --scrim:rgba(2,5,9,.62); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;transition:background-color .4s ease,color .4s ease}
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at 8% -6%,var(--glow-a),transparent 62%),radial-gradient(800px 560px at 100% 8%,var(--glow-b),transparent 60%),radial-gradient(700px 500px at 50% 112%,var(--glow-a),transparent 65%)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--font-display);font-size:clamp(1.9rem,3.6vw,2.6rem);line-height:1.05;letter-spacing:-.01em}
h2{font-family:var(--font-display);font-size:1.45rem;line-height:1.15}
h3{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-size:.86em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1480px;margin:0 auto;padding-block:20px}
.rail{position:sticky;top:20px;align-self:start;height:calc(100vh - 40px);display:flex;flex-direction:column;gap:18px;padding:18px 14px;border-radius:22px;background:var(--panel);border:1px solid var(--edge);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3)}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px}
.mark{width:42px;height:42px;color:var(--ink);flex:none}
.mark .sweeper{transform-origin:24px 24px;animation:sweep 60s steps(60) infinite;stroke:var(--accent)}
@keyframes sweep{to{transform:rotate(360deg)}}
.brand b{font-family:var(--font-display);font-size:1.4rem;line-height:1;display:block;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.74rem;margin-top:3px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;font-weight:500;transition:background .2s,color .2s,transform .2s;text-decoration:none}
.nav-link:hover{background:var(--accent-soft);color:var(--ink);transform:translateX(2px)}
.nav-link.on{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
main{min-width:0}
main.enter{animation:viewIn .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2;transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--accent)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 8px 18px -8px var(--accent)}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 12px 24px -8px var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:var(--bad-bg)}
.btn.solid-danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{padding:6px 11px;min-height:34px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;transition:background .18s,color .18s,transform .18s}
.icon:hover{background:var(--accent-soft);color:var(--accent);transform:translateY(-1px)}
.icon.danger:hover{background:var(--bad-bg);color:var(--bad)}
.icon:active{transform:scale(.92)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--field);color:var(--ink);transition:border-color .18s,box-shadow .18s;font-weight:400;font-size:.92rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:66px;line-height:1.45}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px}
.check{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:500;color:var(--ink);cursor:pointer}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--field);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.84rem;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.glass{background:var(--panel);border:1px solid var(--edge);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25)}
.card{padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.paid{color:var(--good);background:var(--good-bg)}
.pill.sent{color:var(--info);background:var(--info-bg)}
.pill.draft{color:var(--muted);background:var(--accent-soft)}
.pill.overdue{color:var(--bad);background:var(--bad-bg)}
.pill.cancelled{color:var(--muted);background:var(--accent-soft);text-decoration:line-through}
.pill.low{color:var(--warn);background:var(--warn-bg)}
.pill.out{color:var(--bad);background:var(--bad-bg)}
.pill.ok{color:var(--good);background:var(--good-bg)}

/* page head */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head p{color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--warn-bg);color:var(--ink);margin-bottom:18px;font-size:.9rem;border:1px solid var(--line)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:18px 20px;transition:transform .25s ease,box-shadow .25s ease}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.kpi span{font-size:.8rem;font-weight:600;color:var(--muted)}
.kpi strong{display:block;font-family:var(--font-display);font-size:2.15rem;line-height:1.1;margin-top:6px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.card h2{margin-bottom:14px}
.card .sub{color:var(--muted);font-size:.84rem;margin:-8px 0 14px}
.chart text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row>div{min-width:0}
.row>div:first-child{flex:1 1 0}
.row>div:last-child:not(:first-child){flex:none}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:1.3rem;margin-bottom:4px}

/* toolbar + tables */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end}
.toolbar label.f.grow{flex:1 1 260px;min-width:0}
.toolbar label.f{flex:0 1 150px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.tablewrap{overflow-x:auto;border-radius:20px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:.76rem;text-align:left;color:var(--muted);font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .18s}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.cell-actions{display:flex;justify-content:flex-end;gap:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left}
.linkbtn:hover{text-decoration:underline}

/* inventory */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.watch{display:flex;flex-direction:column;overflow:hidden;transition:transform .28s cubic-bezier(.2,.7,.2,1),box-shadow .28s;animation:rise .5s both;animation-delay:calc(var(--d,0)*40ms)}
.watch:hover{transform:translateY(-5px);box-shadow:var(--shadow-lift)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.art{aspect-ratio:4/3;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.55),transparent 62%),linear-gradient(160deg,var(--accent-soft),var(--info-bg));overflow:hidden;position:relative}
.art svg{height:88%;width:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.art img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.watch:hover .art svg{transform:scale(1.06) rotate(-3deg)}
.watch:hover .art img{transform:scale(1.05)}
.art .pill{position:absolute;top:10px;left:10px;backdrop-filter:blur(8px)}
.wbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.wbody .brand-l{font-size:.76rem;font-weight:700;color:var(--accent)}
.wbody h3{font-family:var(--font-display);font-size:1.3rem;line-height:1.1;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.74rem;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--muted);font-weight:600}
.wfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-family:var(--font-display);font-size:1.45rem;font-weight:700}
.wactions{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}

/* clients */
.cc{padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .25s,box-shadow .25s;animation:rise .5s both;animation-delay:calc(var(--d,0)*40ms)}
.cc:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.25rem;background:linear-gradient(135deg,var(--accent-soft),var(--info-bg));color:var(--accent);border:1px solid var(--line);flex:none}
.cc .top{display:flex;gap:12px;align-items:center;min-width:0}
.cc .top>div{min-width:0}
.cc .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.cc dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0;font-size:.82rem}
.cc dt{color:var(--muted)}
.cc dd{margin:0;font-weight:600;text-align:right}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:18px;align-items:start}
.ed-form{display:flex;flex-direction:column;gap:14px}
.sec{padding:20px}
.sec>h2{margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.tplrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tplopt{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:.84rem;font-weight:600;transition:border-color .2s,transform .2s,box-shadow .2s;background:var(--field)}
.tplopt:hover{transform:translateY(-2px)}
.tplopt input{position:absolute;opacity:0;inset:0;cursor:pointer;width:100%;height:100%}
.tplopt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tplopt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.thumb{height:54px;border-radius:7px;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden}
.thumb::before{content:"";position:absolute;left:8px;right:8px;top:9px;height:5px;border-radius:2px;background:#cfd4dc}
.thumb::after{content:"";position:absolute;left:8px;right:22px;top:22px;height:18px;border-radius:2px;background:repeating-linear-gradient(#e6e9ee 0 3px,transparent 3px 7px)}
.thumb.modern{border-top:12px solid #1B304E}
.thumb.classic{border-top:3px solid #8F6118}
.thumb.minimal{border-top:1px solid #9aa2ae}
.item{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--field);animation:rise .35s both}
.item-top{display:flex;gap:8px;align-items:center}
.item-top select{flex:1}
.item-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.84rem}
.hint{color:var(--muted);font-size:.8rem}
.hint.warn{color:var(--bad);font-weight:600}
.savebar{position:sticky;bottom:14px;z-index:5;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel-strong)}
.savebar .tot{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1}
.savebar small{display:block;color:var(--muted);font-size:.78rem}
.ed-preview{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;border-radius:20px}
.edtabs{display:none;margin-bottom:12px}

/* invoice paper (always light, like real paper) */
.paper{--pa:#8F6118;--pad:clamp(16px,3.2vw,30px);background:#fff;color:#161b24;border-radius:10px;padding:var(--pad);font-size:12.5px;line-height:1.5;box-shadow:0 20px 50px -22px rgba(10,18,32,.55);font-family:var(--font-body);position:relative;overflow:hidden}
.paper.tpl-modern{--pa:#1B304E}
.paper.tpl-minimal{--pa:#59616f}
.p-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:16px;border-bottom:2px solid var(--pa)}
.tpl-modern .p-head{background:#141E2E;color:#fff;margin:calc(var(--pad)*-1) calc(var(--pad)*-1) 18px;padding:var(--pad);border:0}
.tpl-minimal .p-head{border-bottom:1px solid #cfd4dc}
.p-brand{display:flex;gap:12px;align-items:center;min-width:0}
.p-brand img{max-height:46px;max-width:120px;object-fit:contain}
.p-brand b{font-family:var(--font-display);font-size:1.7em;line-height:1;display:block;font-weight:700}

.p-table th{background:#f2f4f7;color:#3b4350;padding:7px 8px;font-size:.82em;border:0}
.tpl-modern .p-table th{background:#141E2E;color:#fff}
.p-table td{padding:9px 8px;border-bottom:1px solid #e4e7ec;vertical-align:top}

.tpl-modern .p-note{background:#eaeff6;color:#2c3e57}
.tpl-minimal .p-note{background:#f3f4f6;color:#4a5260}
.stamp{position:absolute;right:28px;top:120px;border:3px solid #17754E;color:#17754E;padding:2px 14px;border-radius:8px;font-weight:700;font-size:1.6em;letter-spacing:.1em;transform:rotate(-12deg);opacity:.22;pointer-events:none}

/* modal + toast */
.modal-back{position:fixed;inset:0;z-index:60;background:var(--scrim);backdrop-filter:blur(6px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s both;overflow:auto}

.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel-strong);border:1px solid var(--edge);border-radius:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.modal.wide{width:min(860px,100%)}

function chartHTML(list,cur){
  const now=new Date(),ms=[];for(let k=5;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);ms.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),label:MON[d.getMonth()],paid:0,out:0})}
  list.forEach(i=>{const m=ms.find(x=>x.key===i.date.slice(0,7));if(m){const t=calc(i).total;if(i.status==='Paid')m.paid+=t;else m.out+=t}});
  const raw=Math.max(...ms.map(m=>m.paid+m.out),1),p=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(s=>s*p).find(s=>s*4>=raw),top=step*4;
  const W=520,H=230,L=46,R=10,T=12,B=28,pw=W-L-R,ph=H-T-B,bw=pw/6;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sales by month" style="width:100%;height:auto">';
  for(let g=0;g<=4;g++){const y=T+ph-ph*g/4;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+compact(top*g/4)+'</text>'}
  ms.forEach((m,i)=>{
    const x=L+i*bw+bw*.2,w=bw*.6,hp=m.paid/top*ph,ho=m.out/top*ph,yb=T+ph;
    s+='<g><title>'+m.label+': '+fmt(m.paid+m.out,cur)+'</title>';
    if(hp>0)s+='<rect x="'+x+'" y="'+(yb-hp)+'" width="'+w+'" height="'+hp+'" rx="4" fill="var(--accent)"/>';
    if(ho>0)s+='<rect x="'+x+'" y="'+(yb-hp-ho)+'" width="'+w+'" height="'+ho+'" rx="4" fill="var(--info)" opacity=".75"/>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-9)+'" text-anchor="middle">'+m.label+'</text></g>';
  });
  return s+'</svg><div class="legend"><span><i style="background:var(--accent)"></i>Paid</span><span><i style="background:var(--info);opacity:.75"></i>Sent, not yet paid</span></div>';
}

  let l=db.inventory.filter(w=>{
    if(IF.brand!=='all'&&w.brand!==IF.brand)return false;
    if(IF.stock==='low'&&!(w.stock>0&&w.stock<=th))return false;if(IF.stock==='out'&&w.stock>0)return false;if(IF.stock==='in'&&w.stock<=0)return false;
    return !q||(w.brand+' '+w.model+' '+w.ref+' '+w.caseMaterial+' '+w.movement).toLowerCase().includes(q);
  });
  const k=IF.sort;l.sort((a,b)=>k==='price-desc'?b.price-a.price:k==='price-asc'?a.price-b.price:k==='stock-asc'?a.stock-b.stock:(a.brand+a.model).localeCompare(b.brand+b.model));

/* ---------- verify ---------- */
function vVerify(){
  const all=[];db.invoices.forEach(i=>{if(i.status!=='Cancelled')watchLines(i).forEach(x=>all.push({code:certNo(i,x.it,x.idx),inv:i,it:x.it}))});
  all.sort((a,b)=>b.inv.date.localeCompare(a.inv.date));
  return '<div class="head"><div><h1>Verify a certificate</h1><p>Enter the certificate number printed on a warranty card or certificate of authenticity.</p></div></div>'
  +'<form class="glass card" data-form="verify" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end"><label class="f" style="flex:1 1 260px">Certificate number<input type="text" id="vCode" class="mono" placeholder="AC-XXXX-XXXX" autocomplete="off" spellcheck="false"></label><button class="btn primary" type="submit">'+ic('shield')+'Verify</button></form><div id="vOut"></div>'
  +'<section class="glass card" style="margin-top:14px"><h2>Recently issued</h2>'+(all.length?'<div class="rows">'+all.slice(0,8).map(a=>'<div class="row"><div><div class="t mono">'+a.code+'</div><div class="s">'+esc(a.it.brand+' '+a.it.model)+' &middot; '+esc(a.inv.client.name)+'</div></div><button class="btn sm" type="button" data-act="verifyCode" data-code="'+a.code+'">Check</button></div>').join('')+'</div>':'<div class="empty"><b>No certificates yet</b>Certificates are created for each watch on an invoice.</div>')+'</section>';
}
function verifyCode(code){
  code=String(code||'').trim().toUpperCase();const out=$('#vOut');if(!out)return;
  if(!code){out.innerHTML='';return}
  let hit=null;db.invoices.forEach(i=>{if(i.status!=='Cancelled')watchLines(i).forEach(x=>{if(certNo(i,x.it,x.idx)===code)hit={inv:i,it:x.it}})});
  if(!hit){out.innerHTML='<div class="glass vres no"><h2 style="color:var(--bad)">No match found</h2><p class="muted" style="margin-top:6px">No certificate with the number <span class="mono">'+esc(code)+'</span> exists in this workspace. Check the number for typos, or confirm the invoice has not been cancelled.</p></div>';return}
  const i=hit.inv,it=hit.it;
  out.innerHTML='<div class="glass vres ok"><h2 style="color:var(--good)">Certificate is valid</h2><dl class="dl"><dt>Certificate</dt><dd class="mono">'+esc(code)+'</dd><dt>Watch</dt><dd>'+esc(it.brand+' '+it.model)+'</dd><dt>Reference or serial</dt><dd class="mono">'+esc(it.serial||'-')+'</dd><dt>Case and movement</dt><dd>'+esc([it.caseMaterial,it.movement].filter(Boolean).join(', ')||'-')+'</dd><dt>Sold to</dt><dd>'+esc(i.client.name)+'</dd><dt>Invoice</dt><dd class="mono">'+esc(i.number)+'</dd><dt>Purchase date</dt><dd>'+fmtDate(i.date)+'</dd><dt>Warranty until</dt><dd>'+fmtDate(addMonths(i.date,num(it.warranty)))+' ('+num(it.warranty)+' months)</dd></dl></div>';
}

function newDraft(){
  const s=db.settings,t=today();
  return{id:uid(),number:nextNumber(),date:t,due:addDays(t,14),status:'Draft',currency:s.currency,template:s.template,clientId:'',client:{name:'',email:'',phone:'',billing:'',shipping:''},sameShip:true,saveClient:true,items:[blankItem()],discount:0,discType:'pct',taxRate:s.taxRate,shipping:0,notes:s.notes,terms:s.terms,_new:true};

function startInvoice(pre){
  ed=newDraft();
  if(pre&&pre.watch){const w=db.inventory.find(x=>x.id===pre.watch);if(w){ed.items=[fillFromWatch(blankItem(),w)]}}
  if(pre&&pre.client)fillClient(pre.client);

}

function updateAll(){
  if(!ed)return;

  ed.items.forEach((it,i)=>updateItemMeta(i));
}
function updateItemMeta(i){
  const it=ed.items[i];if(!it)return;
  const ln=$('[data-line="'+i+'"]'),st=$('[data-stk="'+i+'"]');
  if(ln)ln.textContent=fmt(num(it.qty)*num(it.price),ed.currency);
  if(st){
    if(it.invId&&ed.status!=='Cancelled'){
      const used=ed.items.reduce((s,x)=>s+(x.invId===it.invId?num(x.qty):0),0),a=availFor(it.invId,ed._new?null:ed.id);
      if(used>a){st.className='hint warn';st.textContent='Only '+a+' in stock. Lower the quantity or restock first.'}
      else{st.className='hint';st.textContent=(a-used)+' will remain in stock after this invoice.'}
    }else{st.className='hint';st.textContent=it.invId?'':'Custom items do not change inventory.'}
  }
}
function refreshItems(){$('#itemsBox').innerHTML=ed.items.map(itemRow).join('');updateAll()}
function validateInvoice(){
  const e=ed;
  if(!(e.client.name||'').trim())return 'Add the client name before saving.';
  const items=e.items.filter(i=>(i.brand||i.model||'').toString().trim());
  if(!items.length)return 'Add at least one watch with a brand or model name.';
  if(items.some(i=>num(i.qty)<1))return 'Every watch needs a quantity of at least 1.';
  if(e.status!=='Cancelled'){
    const used={};items.forEach(i=>{if(i.invId)used[i.invId]=(used[i.invId]||0)+num(i.qty)});
    for(const id in used){const a=availFor(id,e._new?null:e.id);if(used[id]>a){const w=db.inventory.find(x=>x.id===id);return 'Only '+a+' of '+w.brand+' '+w.model+' in stock.'}}
  }
  return '';
}
function saveInvoice(thenPdf){
  const err=validateInvoice();if(err){toast(err,'bad');return}
  const e=clone(ed),isNew=!!e._new;delete e._new;
  e.items=e.items.filter(i=>(i.brand||i.model||'').toString().trim()).map(i=>Object.assign({},i,{qty:Math.max(1,Math.round(num(i.qty))),price:round2(i.price),warranty:Math.max(0,Math.round(num(i.warranty)))}));
  if(e.sameShip)e.client.shipping=e.client.billing;
  if(!e.number.trim())e.number=nextNumber();
  if(!e.clientId&&e.saveClient&&e.client.name.trim()){
    const c={id:uid(),name:e.client.name.trim(),email:e.client.email,phone:e.client.phone,billing:e.client.billing,shipping:e.client.shipping};
    db.clients.push(c);e.clientId=c.id;
  }
  delete e.saveClient;
  const idx=db.invoices.findIndex(x=>x.id===e.id),old=idx>=0?db.invoices[idx]:null;
  applyStock(old,e);
  if(old)db.invoices[idx]=e;else{db.invoices.push(e);db.settings.nextNo=(db.settings.nextNo||1)+1}
  saveDB();toast(isNew?'Invoice '+e.number+' created. Stock updated.':'Invoice '+e.number+' saved.');
  ed=null;go('invoices');
  if(thenPdf)downloadInvoice(e.id);
}

async function saveFile(name,data){
  const d=await getDL();
  if(d){
    try{await d.save({filename:name,data});toast('Saved '+name);return true}catch(e){if(e&&e.code==='declined')return false;toast('Could not save '+name+(e&&e.code?' ('+e.code+')':'')+'.','bad');return false}
  }
  try{
    const ext=(name.split('.').pop()||'').toLowerCase(),types={pdf:'application/pdf',csv:'text/csv;charset=utf-8',json:'application/json'};
    const blob=new Blob([data],{type:types[ext]||'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);

    doc.setFont('times','bold');doc.setFontSize(12);doc.text(s.name||'the seller',W/2,s.logo?75:64,{align:'center'});
    const top=s.logo?86:76;let gx=70;
    if(w&&w.image){try{doc.addImage(w.image,imgType(w.image),26,top,34,34);gx=70}catch(e){gx=26}}else gx=26;
    const rows=[['Brand',it.brand||'-'],['Model',it.model||'-'],['Reference or serial',it.serial||'-'],['Case',it.caseMaterial||'-'],['Movement',it.movement||'-'],['Purchased by',inv.client.name],['Purchase date',fmtDate(inv.date)],['Invoice',inv.number]];
    rows.forEach((r,i)=>{const col=i%2,row=Math.floor(i/2),cx=gx+col*100,cy=top+6+row*10;doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(120,128,140);doc.text(r[0].toUpperCase(),cx,cy);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(25,29,38);doc.text(wrapText(doc,r[1],90)[0],cx,cy+5)});
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,128,140);doc.text('CERTIFICATE NUMBER',W/2,H-48,{align:'center'});
    doc.setFont('courier','bold');doc.setFontSize(22);doc.setTextColor(A[0],A[1],A[2]);doc.text(no,W/2,H-39,{align:'center'});
    doc.setDrawColor(120,128,140);doc.setLineWidth(.25);doc.line(30,H-24,95,H-24);doc.line(W-95,H-24,W-30,H-24);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(100,108,120);doc.text('Authorised signatory',30,H-19.5);doc.text('Date of issue  '+fmtDate(inv.date),W-95,H-19.5);
    doc.setFontSize(7);doc.text('To verify this certificate, give the number above to '+(s.name||'the seller')+(s.email?' ('+s.email+')':'')+'.',W/2,H-16,{align:'center'});
  });
  return doc;
}
async function downloadInvoice(id){const i=db.invoices.find(x=>x.id===id);if(!i||!needPdf())return;await saveFile(i.number+'.pdf',pdfInvoiceDoc(i).output('arraybuffer'))}
async function downloadWarranty(id){const i=db.invoices.find(x=>x.id===id);if(!i||!needPdf())return;if(!watchLines(i).length){toast('Add a watch with a serial number first.','warn');return}await saveFile(i.number+'-warranty-cards.pdf',pdfWarrantyDoc(i).output('arraybuffer'))}
async function downloadCert(id){const i=db.invoices.find(x=>x.id===id);if(!i||!needPdf())return;if(!watchLines(i).length){toast('Add a watch with a serial number first.','warn');return}await saveFile(i.number+'-certificates.pdf',pdfCertDoc(i).output('arraybuffer'))}
function csvEsc(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportCSV(){
  const rows=[['Invoice','Date','Due','Status','Client','Email','Currency','Subtotal','Discount','Tax','Shipping','Total','Watches']];
  filteredInvoices().forEach(i=>{const c=calc(i);rows.push([i.number,i.date,i.due,dstatus(i),i.client.name,i.client.email,i.currency,c.sub,c.disc,c.tax,c.ship,c.total,i.items.map(t=>(t.brand+' '+t.model+' x'+t.qty).trim()).join('; ')])});
  await saveFile('invoices-'+today()+'.csv',rows.map(r=>r.map(csvEsc).join(',')).join('\n'));
}

/* ---------- images ---------- */
function readImage(file,max,type,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));im.onload=()=>{
      const r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r)),cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');if(type==='image/jpeg'){cx.fillStyle='#fff';cx.fillRect(0,0,w,h)}cx.drawImage(im,0,0,w,h);
      res({url:cv.toDataURL(type,q),ratio:w/h})};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

async function copyOut(text,el){
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard.');return}catch(e){}
  if(el&&el.select){el.focus();el.select();toast('Press Ctrl+C (or Cmd+C) to copy the selected text.','warn')}else toast('Copying is blocked here. Select the text and copy it by hand.','warn');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const fn=A[t.dataset.act];if(fn){e.preventDefault();fn(t)}
});
function onField(e){
  const el=e.target;
  if(el.matches('[data-filter]')){F[el.dataset.filter]=el.value;if(view==='invoices'){$('#invRows').innerHTML=invRows()}return}
  if(el.matches('[data-ifilter]')){IF[el.dataset.ifilter]=el.value;$('#invGrid').innerHTML=invGrid();return}
  if(el.matches('[data-cq]')){CQ=el.value;$('#cliGrid').innerHTML=cliGrid();return}
  if(el.matches('[data-statusfor]')){if(e.type==='change'){setStatus(el.dataset.statusfor,el.value);viewInvoice(el.dataset.statusfor);if(view==='invoices')$('#invRows').innerHTML=invRows();else if(view==='dashboard'||view==='inventory'||view==='clients')render()}return}
  if(el.matches('[data-set]')){
    const p=el.dataset.set;let v=el.value;if(el.dataset.num)v=num(v);
    setPath(db.settings,p,v);saveDB();if(p==='shop.name')$('#brandShop').textContent=v||'Your watch shop';return;
  }
  if(!ed||view!=='editor')return;
  if(el.matches('[data-pick]')){
    if(e.type!=='change')return;const i=+el.dataset.pick,w=db.inventory.find(x=>x.id===el.value);
    if(w)fillFromWatch(ed.items[i],w);else ed.items[i].invId='';
    refreshItems();return;
  }
  if(el.matches('[data-f]')){
    const i=+el.dataset.i,f=el.dataset.f;ed.items[i][f]=el.type==='number'?(el.value===''?'':num(el.value)):el.value;
    if(f==='brand'||f==='model'||f==='serial')ed.items[i].invId=ed.items[i].invId;
    updateAll();return;
  }
  if(el.matches('[data-bind]')){
    const p=el.dataset.bind;let v;
    if(el.type==='checkbox')v=el.checked;else if(el.type==='radio'){if(!el.checked)return;v=el.value}else if(el.type==='number')v=el.value===''?0:num(el.value);else v=el.value;
    if(p==='clientId'){if(e.type!=='change')return;if(v){fillClient(v)}else{ed.clientId='';ed.saveClient=true}
      render();return}
    setPath(ed,p,v);
    if(p==='sameShip'){$('#shipWrap').hidden=v}
    if(p==='client.billing'&&ed.sameShip)ed.client.shipping=v;
    if(p==='client.name'&&ed.clientId===''){}
    if(p==='currency'||p==='status'||p==='discType'||p==='template'||p==='sameShip')updateAll();else updateAll();
  }
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,d=Object.fromEntries(new FormData(f).entries());
  if(k==='watch'){
    const o={brand:d.brand.trim(),model:d.model.trim(),ref:d.ref.trim(),caseMaterial:d.caseMaterial.trim(),movement:d.movement,price:round2(d.price),stock:Math.max(0,Math.round(num(d.stock))),warranty:Math.max(0,Math.round(num(d.warranty))),image:pendingImg};
    if(!o.brand||!o.model){toast('Brand and model name are required.','bad');return}
    if(f.dataset.id){Object.assign(db.inventory.find(x=>x.id===f.dataset.id),o);toast('Watch updated.')}else{db.inventory.push(Object.assign({id:uid()},o));toast('Watch added to inventory.')}
    saveDB();closeModal();render();
  }else if(k==='restock'){
    const w=db.inventory.find(x=>x.id===f.dataset.id),n=Math.max(1,Math.round(num(d.add)));w.stock+=n;saveDB();closeModal();toast(n+' added. '+w.model+' now has '+w.stock+' in stock.');render();
  }else if(k==='client'){
    const o={name:d.name.trim(),email:d.email.trim(),phone:d.phone.trim(),billing:d.billing.trim(),shipping:d.shipping.trim()||d.billing.trim()};
    if(!o.name){toast('Client name is required.','bad');return}
    if(f.dataset.id)Object.assign(db.clients.find(x=>x.id===f.dataset.id),o);else db.clients.push(Object.assign({id:uid()},o));
    saveDB();closeModal();toast(f.dataset.id?'Client updated.':'Client added.');render();
  }else if(k==='verify'){verifyCode(d.vCode||$('#vCode').value)}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='wImg'&&el.files[0]){try{const r=await readImage(el.files[0],640,'image/jpeg',.82);pendingImg=r.url;$('#wPrev').innerHTML='<img src="'+r.url+'" alt="">'}catch(x){toast('That image could not be read. Try a JPG or PNG.','bad')}}
  if(el.id==='logoIn'&&el.files[0]){try{const r=await readImage(el.files[0],360,'image/png');db.settings.shop.logo=r.url;db.settings.shop.logoRatio=r.ratio;saveDB();toast('Logo updated.');render()}catch(x){toast('That image could not be read. Try a PNG or JPG.','bad')}}
  if(el.id==='fileImport'&&el.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!j.settings||!Array.isArray(j.inventory)||!Array.isArray(j.invoices)||!Array.isArray(j.clients))throw 0;confirmModal({title:'Restore this backup?',text:'It replaces everything currently in the app ('+j.invoices.length+' invoices, '+j.inventory.length+' watches, '+j.clients.length+' clients).',ok:'Restore backup',danger:true,onOk:()=>{db=j;saveDB();buildShell();toast('Backup restored.');render()}})}catch(x){toast('That file is not a Dial & Ledger backup.','bad')}el.value=''};fr.readAsText(el.files[0]);
  }
});

/* ---------- boot ---------- */
